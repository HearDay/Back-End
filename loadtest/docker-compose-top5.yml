services:
  # Locust Master (Web UI)
  locust-master:
    image: locustio/locust:2.20.0
    container_name: locust-top5-master
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile_top5.py:/home/locust/locustfile.py
      - ./results:/home/locust/results
    command: -f /home/locust/locustfile.py --master --host=http://host.docker.internal:8080
    networks:
      - locust-network
    environment:
      - LOCUST_MASTER=true

  # Locust Worker 1
  locust-worker-1:
    image: locustio/locust:2.20.0
    container_name: locust-top5-worker-1
    volumes:
      - ./locustfile_top5.py:/home/locust/locustfile.py
    command: -f /home/locust/locustfile.py --worker --master-host=locust-master
    networks:
      - locust-network
    depends_on:
      - locust-master

  # Locust Worker 2
  locust-worker-2:
    image: locustio/locust:2.20.0
    container_name: locust-top5-worker-2
    volumes:
      - ./locustfile_top5.py:/home/locust/locustfile.py
    command: -f /home/locust/locustfile.py --worker --master-host=locust-master
    networks:
      - locust-network
    depends_on:
      - locust-master

networks:
  locust-network:
    driver: bridge
